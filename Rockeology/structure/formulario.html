<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" href="..\style\formulario.css">
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">


</head>

<body>
    <header>
        <h1 class="Logo">Rockeology</h1>
        <div class="login">
            <ul>
                <li><a href="login.html" class="nav-item">Login</a></li>
            </ul>
        </div>
    </header>

    <nav class="menu">
        <ul>
            <li><a href="../index.html" class="nav-item">Home</a></li>
            <li><a href="genre.html" class="nav-item">Gêneros</a></li>
            <li><a href="artist.html" class="nav-item">Artistas</a></li>
            <li><a href="formulario.html" class="nav-item">Formulário</a></li>
            <li><a href="about.html" class="nav-item">Sobre</a></li>
        </ul>
    </nav>

    <main>
        <section class="title">
            <h3>Cadastro</h3>
        </section>

        <section class="sec-form">
            <div class="forms">
                <form>
                    <label for="Nome">Nome:</label><br>
                    <input type="text" name="Nome" placeholder="Nome Completo" required><br>
                    <label for="Email">E-mail:</label><br>
                    <input type="email" name="Email" placeholder="E-mail" required><br>
                    <label for="Senha">Senha:</label><br>
                    <input type="password" name="Senha" placeholder="Senha" required><br>
                    <br>
                    <button type="submit">Cadastrar</button>
                    <button type="reset">Resetar</button>
                </form>
            </div>
        </section>

        <section class="title">
            <h3>Que tipo de Gênero você mais ouve?</h3>
        </section>

        <section class="sec-form">
            <div class="forms-genre">
                <input type="checkbox" name="Punk Rock"> <label for="Punk Rock">Punk Rock</label>
                <input type="checkbox" name="Metal Core"> <label for="Metal Core">Metal Core</label><br>
                <input type="checkbox" name="Hard Rock"> <label for="Hard Rock">Hard Rock</label>
                <input type="checkbox" name="Metal"> <label for="Metal">Metal</label><br>
                <input type="checkbox" name="Death Metal"> <label for="Death Metal">Death Metal</label>
                <input type="checkbox" name="Black Metal"> <label for="Black Metal">Black Metal</label><br>
                <input type="checkbox" name="Power Metal"> <label for="Power Metal">Power Metal</label>
                <input type="checkbox" name="Grunge Rock"> <label for="Grunge Rock">Grunge Rock</label><br>
                <input type="checkbox" name="Alternative Metal"> <label for="Alternative Metal">Alternative
                    Metal</label>
                <input type="checkbox" name="New Metal"> <label for="New Metal">New Metal</label><br>
            </div>
        </section>
    </main>

    <footer>

    </footer>

</body>

</html>
