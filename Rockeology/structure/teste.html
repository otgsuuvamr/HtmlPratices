<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes</title>
</head>

<body>
    <div>
        <div class="box" style="background-color: black; width: 100px; height: 
100px;"></div><br>
        <div class="box1" style="background-color: rgb(138, 103, 103); width: 100px; height: 
100px;"></div><br>
        <div class="box2" style="background-color: rgb(201, 20, 20); width: 100px; height: 
100px;"></div><br>
        <div class="box3" style="background-color: rgb(20, 53, 201); width: 100px; height: 
100px;"></div><br>
        <div class="box4" style="background-color: rgb(86, 201, 20); width: 100px; height: 
100px;"></div><br>
        <div class="box5" style="background-color: rgb(201, 41, 20); width: 100px; height: 
100px;"></div><br>
    </div>
    <style>
        .box:hover {
            transform: rotate(360deg);
            transition: 2s;
        }

        .box1:hover {
            transform: translateX(100px);
            transition: 5s;
        }

        .box2:hover {
            transform: rotatex(360deg);
            transition: 2s;
        }

        .box3:hover {
            transform: rotatey(360deg);
            transition: 2s;
        }

        .box4:hover {
            transform: scale(1.2);
            transition: 2s;
        }

        .box5:hover {
            transform: scaleX(1.2);
            transition: 2s;
        }
    </style>
</body>

</html>
