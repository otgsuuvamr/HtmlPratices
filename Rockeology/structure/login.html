   <main>
      <section class="title">
         <h3>Login</h3>
      </section>

      <section class="sec-form">
         <div class="unique-form">
            <div class="forms">
               <form id="forms-cad1">
                  <br>
                  <label for="User">Usuário:</label>
                  <br>
                  <input type="text" id="user" name="User" placeholder="Usuário" required><br>
                  <br>
                  <label for="Senha">Senha:</label>
                  <br>
                  <input type="password" id="pass" name="Senha" placeholder="Senha" required><br>
                  <br>
                  <button type="submit">Entrar</button>
               </form>
            </div>

            <button id="cadastro">Cadastrar</button>

            <div id="forms2" class="showForms">
               <form id="forms-cad">
                  <br>
                  <label for="User">Novo Usuário:</label>
                  <br>
                  <input type="text" id="newuser" name="User" placeholder="Usuário" required><br>
                  <br>
                  <label for="Senha">Nova Senha:</label>
                  <br>
                  <input type="password" id="newpssw" name="Senha" placeholder="Senha" required><br>
                  <br>
                  <button type="submit">Cadastrar</button>
               </form>
            </div>
         </div>
      </section>
