<!DOCTYPE html>
<html lang="pt-br">

<head>
   <meta charset="UTF-8">
   <title>Login</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="..\style.css">
   <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">


</head>

<body>
   <header>
      <h1 class="Logo">Rockeology</h1>
      <div class="login">
         <ul>
            <li><a href="login.html" class="nav-item" onclick="logout()">Logout</a></li>
         </ul>
      </div>
   </header>

   <nav class="menu">
      <ul>
         <li><a href="../index.html" class="nav-item">Home</a></li>
         <li><a href="genre.html" class="nav-item">Gêneros</a></li>
         <li><a href="artist.html" class="nav-item">Artistas</a></li>
         <li><a href="about.html" class="nav-item">Sobre</a></li>
      </ul>
   </nav>

   <main>
      <section class="title">
         <h3>Login</h3>
      </section>

      <section class="login-form">
         <form onsubmit="fazerLogin(event)">
            <label for="usuario">Usuário:</label><br>
            <input type="text" id="usuario" required><br>

            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" required><br>

            <button type="submit">Entrar</button>
         </form>
      </section>
   </main>

   <script>
      function fazerLogin(e) {
         e.preventDefault();
         const usuario = document.getElementById("usuario").value;
         const senha = document.getElementById("senha").value;

         // Simulação de login (validação simples)
         if (usuario && senha) {
            localStorage.setItem("logado", "true");
            window.location.href = "../menu/index.html";
         } else {
            alert("Usuário ou senha inválidos.");
         }
      }
   </script>


   </main>

   <footer>
      <p>&copy; 2025 Rockeology. Todos os direitos reservados.</p>
   </footer>

   <script>
      function logout() {
         localStorage.removeItem("logado");
         window.location.href = "login.html";
      }
   </script>

</body>

</html>
